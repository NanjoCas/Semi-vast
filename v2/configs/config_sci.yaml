# =============================================================================
# Semi-vast v2 configuration —— 数据集更换版（README 第 8 节）
# Climate-FEVER + ClimateCheck + SciFact，不再使用 PUBHEALTH。
# 与 config.yaml 的差异只在标注了 [sci] 的行。
# 所有相对路径都相对于 v2/ 目录解析（见 common/paths.py）。
# =============================================================================

paths:
  # ---- 原始数据（默认复用上一级项目的 Data/ 目录，不复制数据）----
  raw_climate_fever: ../Data/Climate Fever Dataset/archive/climate-fever.jsonl
  raw_pubhealth_dir: ../Data/PUBHEALTH-DATASET/archive
  raw_climatecheck_dir: ../Data/ClimateCheck          # [sci] train/test parquet（测试集金标签已公开）
  raw_scifact_dir: ../Data/SciFact/data               # [sci] claims_{train,dev}.jsonl + corpus.jsonl
  # ---- v2 生成物 ----
  processed_dir: processed/sci      # [sci] 与 PUBHEALTH 版的 processed/labeled 分开
  runs_dir: runs_sci                # [sci]
  results_dir: results_sci          # [sci]
  model_cache_dir: ../model_cache   # 与原项目共用 HF 模型缓存

use_local_models: false

models:
  deberta_base: microsoft/deberta-v3-large
  nli_model: cross-encoder/nli-deberta-v3-large

# ---- 数据构建（data_prep/build_labeled.py）----
data:
  sources: [climate_fever, climatecheck, scifact]   # [sci] 默认 [climate_fever, pubhealth]
  split_seed: 42                    # Climate-FEVER 自行切分 train/dev/test 的种子
  max_evidences: 5                  # [sci] Climate-FEVER 用全部 5 条候选证据（选 3 条会丢掉 9%–19% 的关键证据）
  max_evidence_words: 120           # 单条证据句截断长度（词）
  pubhealth_evidence: main_text     # main_text（推荐，无泄漏） | explanation（旧做法，有泄漏）
  cf_oversample_labeled: 1          # [sci] 气候数据已有 ClimateCheck，不再过采样
  dedup_claims: true                # [sci] Climate-FEVER 原始文件中同一 claim 有多个 id，会跨 split 泄漏；标签矛盾的整组丢弃
  cf_disputed: drop                 # [sci] refutes（v2 原做法）| nei | drop：DISPUTED 证据有支持也有反驳，新数据集里没有对应类
  dev_ratio: 0.15                   # [sci] ClimateCheck / SciFact 从官方 train 按 claim 切出 dev 的比例
  cross_dedup_threshold: 0.5        # [sci] ClimateCheck 与 Climate-FEVER 改写 claim 的 TF-IDF 余弦阈值

# ---- 实验矩阵（run_all.py）----
experiment:
  label_ratios: [0.1, 0.25, 0.5]    # 保留标签的比例，其余 train 样本作为无标签池
  seeds: [42, 43, 44]
  # A=纯监督  B=置信度阈值  L=B+方向一致性(B+L)  Q=B+类内c分位(L-q)  K=同规模置信度对照  W=复合权重过滤(无RL)  R=随机子集(与C同规模)  C=完整模型(RL)  O=Oracle(金标签上界)
  methods: [A, B, L, Q, K, W, R, C, O]
  device: cuda
  confidence_threshold: 0.7         # 方法 B
  consistency_threshold: 0.3        # 方法 L：置信度 ≥ confidence_threshold 且方向一致性 c > 此值
  consistency_quantile: 0.5         # 方法 Q：SUPPORTS / REFUTES 各自在类内按 c 保留的比例（NEI 不用 c）
  weight_threshold: 0.4             # 复合权重过滤阈值（W 与 RL 的输入池）
  cleanup_checkpoints: true         # 每个 run 结束后删除 .pt，只保留指标与预测（DeBERTa-large 每个 ~1.7GB）

algorithm:
  focal_gamma: 2.0
  logit_adjust_tau: 0.5
  loss_type: focal                  # 有监督部分；A 组现在与其他组使用同一损失
  pseudo_loss_type: ce              # 伪标签部分不再用 focal（focal 会把高置信伪标签的 loss 压到 ~0）
  pseudo_weight_norm: mean          # mean: mean(w*L)  |  sum: sum(w*L)/sum(w)（旧做法，权重绝对值失效）

hyperparameters:
  alpha: 0.7
  beta: 0.3
  beta1: 0.5
  beta2: 0.3
  beta3: 0.2
  epsilon: 0.2
  lambda_init: 0.3
  lambda_final: 0.7

imbalance:
  apply_prior_adjust_in_pseudolabels: false   # [sci] 第 7.2.1 节：校正降低伪标签准确率
  class_weight_power: 1.5
  extractor_sampler_power: 1.0
  normalize_class_weights: true
  pseudo_sampler_power: 1.0
  use_balanced_extractor_sampler: false   # [sci] 已有类别权重，再加平衡采样会重复校正：REFUTES 只占 14% 时 extractor 全预测成 REFUTES/NEI（验证 F1 0.22）
  use_balanced_pseudo_sampler: true

rl:
  action_dim: 2
  state_dim: 4
  clip_epsilon: 0.2
  gamma: 1.0                        # 回合末稀疏奖励：gamma<1 会让 512 步前的动作几乎拿不到信号
  gae_lambda: 1.0
  ppo_epochs: 4
  ppo_lr: 0.0003
  n_iterations: 30                  # PPO 更新次数
  episodes_per_iter: 4              # 每次更新采样的回合数（回合间对比才产生有效 advantage）
  episode_size: 512                 # 每回合从池中随机抽取的样本数
  min_keep_ratio: 0.05              # 最终保留比例低于此值时按 keep 概率补足，并在日志中警告

training:
  batch_size: 16
  pseudo_batch_size: 16
  pseudo_ratio: 3                   # 每个有标签 batch 配几个伪标签 batch；伪标签现在是句对，显存不够时改成 1 或 2
  freeze_layers: 6
  gradient_accumulation: 1          # [sci] 有标签部分只有 436 对：累积 4 时 extractor 和 A 组都只有 56 次参数更新，学不充分
  init_from_nli: true
  learning_rate: 1.0e-05
  max_epochs: 8
  max_length: 512                   # [sci] 证据是整篇摘要：384 时约 30% 被截断，512 时 13%；64×512 显存峰值 12.5GB
  num_workers: 4
  seed: 42                          # 会被 run_all.py 的 --seed 覆盖
  use_bf16: true
  use_tf32: true
  warmup_ratio: 0.1                 # 取代固定 warmup_steps：低标注比例下总步数很少，固定 100 步会占满训练
  extractor_text_augment: false     # 旧代码的随机删词增强会把句对 decode 成一句再编码，破坏 claim/evidence 结构
  early_stopping_patience: 5
  # ---- detector 训练预算与速度（train_detector.py）----
  epoch_mode: cover_pseudo          # labeled: 每 epoch 只遍历一遍有标签数据（ratio=0.1 时 8 epoch 仅 136 次更新，O 组学不进去）
                                    # cover_pseudo: 每 epoch 覆盖一遍伪标签集（有标签数据循环使用），伪标签 batch 均匀分布，小集合不再被重复约 10 次
  dynamic_padding: true             # 按 batch 内最长句对补齐（平均 129 token），不再统一补到 max_length=384；结果不变
  gradient_checkpointing: true      # 不能关：实测关闭后 64 条 × 256 token 即 OOM（32GB）；开启时 384 token 峰值约 10GB
